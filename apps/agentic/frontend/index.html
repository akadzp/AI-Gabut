<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agentic</title><link rel="stylesheet" href="/styles.css"></head><body><div id="auth"><form id="login"><h1>Agentic</h1><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>Login</button><button type="button" id="registerMode">Create account</button></form><form id="register" class="hidden"><h1>Create account</h1><input id="name" placeholder="Name"><input id="regEmail" type="email" placeholder="Email" required><input id="regPassword" type="password" placeholder="Password (10+ chars)" required><button>Create</button><button type="button" id="loginMode">Back</button></form></div><div id="app" class="hidden"><aside><button id="menu">☰</button><button id="newChat">+ New Chat</button><h4>Sessions</h4><div id="sessions"></div><div class="bottom"><button data-view="chat">Chat</button><button data-view="connections">Connections</button><button data-view="files">Files</button><button id="logout">Logout</button></div></aside><main><header><strong>Agentic</strong><span id="context"></span><span id="user"></span></header><section id="chatView"><div id="messages"></div><form id="chat"><textarea id="prompt" placeholder="Berikan pekerjaan kepada Agentic..."></textarea><button>Send</button></form></section><section id="connectionsView" class="hidden"><h2>Connections</h2><div id="connections"></div><form id="github"><input id="githubToken" type="password" placeholder="GitHub token"><input id="githubName" placeholder="Connection name"><button>Connect GitHub</button></form></section><section id="filesView" class="hidden"><h2>Files</h2><div id="repos"></div><pre id="file">Pilih repository.</pre></section></main></div><script type="module" src="/app.js"></script></body></html>
